name: E2E API doc-archiver

# Pipeline vivant DANS le repo doc-archiver (avec le code source).
# Monte la topologie locale (API + MinIO + Postgres) en conteneurs jetables,
# puis l'agent analyse -> genere les scenarios des pistes choisies -> execute
# en HTTP (Playwright request) -> poste le rapport dans une issue GitHub.
#
# Choix des pistes :
#   1) contrats/doc-archiver_reponses.md committe (issu du formulaire form_server.py)
#   2) sinon, les inputs workflow_dispatch ci-dessous.

on:
  workflow_dispatch:
    inputs:
      pistes:
        description: "Pistes a tester (ex: isolation,auth ou 'all')"
        required: true
        default: "all"
      regenerer_contrat:
        description: "Case 1 — Regenerer le contrat (decoche = reutilise le contrat committe, sinon le regenere)"
        type: boolean
        default: true
      generer_sans_executer:
        description: "Case 2 — Generer les scenarios SANS executer (s'arrete apres la generation)"
        type: boolean
        default: false
      executer_existant:
        description: "Case 3 — Executer les scenarios EXISTANTS committes (skip toute generation)"
        type: boolean
        default: false
      max_scenarios:
        description: "Plafond de scenarios (0 = illimite)"
        required: false
        default: "40"
      priority_only:
        description: "Prioritaires seulement"
        type: boolean
        default: false
      rapport_live:
        description: "Rapport ecrit en direct"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  e2e-api:
    runs-on: ubuntu-latest
    env:
      API_NAME: doc-archiver
      SOURCE_DIR: ${{ github.workspace }}   # sources a la racine (meme repo)
      BASE_URL: http://localhost:30800
      VILLE: casa
      # Tokens de test (doivent correspondre au docker-compose.test.yml)
      TOKEN_A: test-token-a
      TOKEN_B: test-token-b
      ADMIN_TOKEN: test-admin-token
      LEGACY_TOKEN: test-legacy-token
      RAPPORT_LIVE: ${{ inputs.rapport_live }}
      GITHUB_REPO: ${{ github.repository }}
      GITHUB_ISSUE_NUMBER: ${{ vars.E2E_ISSUE_NUMBER || '1' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      # 1) Checkout unique : code source + pipeline dans le meme repo
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Claude Code CLI + Playwright
        run: |
          npm i -g @anthropic-ai/claude-code
          npm i -D @playwright/test
          # Pas de navigateur : les tests sont en Playwright `request` (HTTP pur).
          # On n'installe donc NI Chromium NI ses deps systeme (gain ~4 min/run).

      # ── Logique des 3 cases ──────────────────────────────────────────────
      #  Case 1 regenerer_contrat      : ☑ regenere / ☐ reutilise (fallback regenere)
      #  Case 2 generer_sans_executer  : ☑ genere scenarios puis STOP
      #  Case 3 executer_existant      : ☑ skip toute generation, execute le committe
      #
      #  Derivees :
      #   - on EXECUTE si NON generer_sans_executer      (case 2 decochee)
      #   - on GENERE les scenarios si NON executer_existant (case 3 decochee)
      #   - la stack Docker ne monte que si on execute

      # 2) Monter la topologie SEULEMENT si on execute
      - name: Start stack (docker compose)
        if: ${{ !inputs.generer_sans_executer }}
        run: docker compose -f docker-compose.test.yml up -d --build

      - name: Wait for API /health
        if: ${{ !inputs.generer_sans_executer }}
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:30800/health >/dev/null 2>&1; then
              echo "API prete"; curl -s http://localhost:30800/health; exit 0
            fi
            echo "attente API ($i)..."; sleep 3
          done
          echo "API jamais prete"; docker compose -f docker-compose.test.yml logs api; exit 1

      # 3) Contrat.
      #    - Case 3 (executer_existant) : on ne touche pas au contrat, on reutilise le committe.
      #    - Sinon : on lance l'analyse. --reuse-if-exists si Case 1 decochee
      #      (=> Claude reutilise le contrat committe s'il existe, sinon le regenere).
      - name: Analyse (Contrat)
        if: ${{ !inputs.executer_existant }}
        run: |
          if [ "${{ inputs.regenerer_contrat }}" = "true" ]; then
            echo "Case 1 cochee -> regeneration du contrat"
            python e2e_api.py --analyze
          else
            echo "Case 1 decochee -> reutilise le contrat committe s'il existe (sinon regenere)"
            python e2e_api.py --analyze --reuse-if-exists
          fi

      - name: Verifier contrat present
        run: |
          if [ ! -f "contrats/doc-archiver_contrat.json" ]; then
            echo "❌ Aucun contrat trouve. Coche Case 1 (Regenerer le contrat) ou commit contrats/doc-archiver_contrat.json"; exit 1
          fi
          echo "✅ Contrat present"

      # 4) Pistes (utile seulement si on genere des scenarios)
      - name: Resoudre pistes
        id: choix
        if: ${{ !inputs.executer_existant }}
        run: |
          if [ -f "contrats/doc-archiver_reponses.md" ]; then
            echo "source=formulaire" >> $GITHUB_OUTPUT
            PISTES=$(awk '/=== PISTES CHOISIES ===/{f=1;next} f&&NF{printf "%s,",$0}' contrats/doc-archiver_reponses.md | sed 's/,$//')
            echo "pistes=$PISTES" >> $GITHUB_OUTPUT
          else
            echo "source=inputs" >> $GITHUB_OUTPUT
            P="${{ inputs.pistes }}"
            if [ "$P" = "all" ]; then P=""; fi
            echo "pistes=$P" >> $GITHUB_OUTPUT
          fi

      # 5) Generer les scenarios (skip si Case 3 : on execute le committe)
      - name: Generer scenarios
        if: ${{ !inputs.executer_existant }}
        run: |
          ARGS=""
          if [ -n "${{ steps.choix.outputs.pistes }}" ]; then ARGS="$ARGS --pistes=${{ steps.choix.outputs.pistes }}"; fi
          if [ "${{ inputs.max_scenarios }}" != "0" ]; then ARGS="$ARGS --max-scenarios=${{ inputs.max_scenarios }}"; fi
          if [ "${{ inputs.priority_only }}" = "true" ]; then ARGS="$ARGS --priority-only"; fi
          echo "python e2e_api.py --generate-scenarios $ARGS"
          python e2e_api.py --generate-scenarios $ARGS

      - name: Verifier scenarios presents
        if: ${{ !inputs.generer_sans_executer }}
        run: |
          if [ ! -f "contrats/doc-archiver_scenarios.md" ]; then
            echo "❌ Aucun scenario trouve. Genere-les (decoche Case 3) ou commit contrats/doc-archiver_scenarios.md"; exit 1
          fi
          echo "✅ Scenarios presents"

      # 6) Executer (skip si Case 2 : generer_sans_executer)
      - name: Executer + rapport
        if: ${{ !inputs.generer_sans_executer }}
        run: |
          ARGS=""
          if [ -n "${{ steps.choix.outputs.pistes }}" ]; then ARGS="$ARGS --pistes=${{ steps.choix.outputs.pistes }}"; fi
          if [ "${{ inputs.max_scenarios }}" != "0" ]; then ARGS="$ARGS --max-scenarios=${{ inputs.max_scenarios }}"; fi
          if [ "${{ inputs.priority_only }}" = "true" ]; then ARGS="$ARGS --priority-only"; fi
          echo "python e2e_api.py --run $ARGS"
          python e2e_api.py --run $ARGS

      # 7) Artefacts
      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api-artefacts
          path: |
            contrats/
            reports/
            tests/

      # 8) Teardown (seulement si la stack a ete montee = on a execute)
      - name: Stop stack
        if: ${{ always() && !inputs.generer_sans_executer }}
        run: docker compose -f docker-compose.test.yml down -v
