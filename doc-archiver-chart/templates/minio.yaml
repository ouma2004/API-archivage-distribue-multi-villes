{{- range $villeName, $ville := .Values.villes }}
{{- if $ville.enabled }}
---
# ═══════════════════════════════════════════════════════════════════════
# MinIO — Ville : {{ $villeName }} (namespace={{ $ville.namespace }}, replicas={{ $ville.minioReplicas }})
# ═══════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio-{{ $villeName }}
  namespace: {{ $ville.namespace }}
spec:
  serviceName: minio-{{ $villeName }}
  replicas: {{ $ville.minioReplicas }}
  selector:
    matchLabels:
      app: minio-{{ $villeName }}
  template:
    metadata:
      labels:
        app: minio-{{ $villeName }}
    spec:
      containers:
        - name: minio
          image: "{{ $.Values.minio.image.repository }}:{{ $.Values.minio.image.tag }}"
          args:
            - server
            - --console-address
            - ":{{ $.Values.minio.consolePort }}"
            {{- if gt ($ville.minioReplicas | int) 1 }}
            - http://minio-{{ $villeName }}-{0...{{ sub ($ville.minioReplicas | int) 1 }}}.minio-{{ $villeName }}.{{ $ville.namespace }}.svc.cluster.local/data
            {{- else }}
            - /data
            {{- end }}
          env:
            - name: MINIO_ROOT_USER
              value: {{ default $.Values.minio.rootUser $ville.minioRootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ default $.Values.minio.rootPassword $ville.minioRootPassword | quote }}
          ports:
            - containerPort: {{ $.Values.minio.apiPort }}
              name: api
            - containerPort: {{ $.Values.minio.consolePort }}
              name: console
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: {{ $.Values.minio.apiPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ $.Values.minio.resources.requests.cpu }}
              memory: {{ $.Values.minio.resources.requests.memory }}
            limits:
              cpu: {{ $.Values.minio.resources.limits.cpu }}
              memory: {{ $.Values.minio.resources.limits.memory }}
  volumeClaimTemplates:
  - metadata:
      name: data

    spec:
      accessModes:
        - ReadWriteOnce

      storageClassName: {{ $.Values.minio.storageClassName }}

      resources:
        requests:
          storage: {{ $.Values.minio.storage }}

---
# Service headless — découverte entre pods MinIO d'une même ville
apiVersion: v1
kind: Service
metadata:
  name: minio-{{ $villeName }}
  namespace: {{ $ville.namespace }}
spec:
  clusterIP: None
  selector:
    app: minio-{{ $villeName }}
  ports:
    - port: {{ $.Values.minio.apiPort }}
      name: api
    - port: {{ $.Values.minio.consolePort }}
      name: console

---
# Service NodePort — API S3 accessible (utilisé par archiver.py)
apiVersion: v1
kind: Service
metadata:
  name: minio-{{ $villeName }}-api
  namespace: {{ $ville.namespace }}
spec:
  type: NodePort
  selector:
    app: minio-{{ $villeName }}
  ports:
    - port: {{ $.Values.minio.apiPort }}
      targetPort: {{ $.Values.minio.apiPort }}
      nodePort: {{ $ville.minioApiNodePort }}

---
# Service NodePort — Console web accessible
apiVersion: v1
kind: Service
metadata:
  name: minio-{{ $villeName }}-console
  namespace: {{ $ville.namespace }}
spec:
  type: NodePort
  selector:
    app: minio-{{ $villeName }}
  ports:
    - port: {{ $.Values.minio.consolePort }}
      targetPort: {{ $.Values.minio.consolePort }}
      nodePort: {{ $ville.minioConsoleNodePort }}
{{- end }}
{{- end }}