# docker-compose.test.yml
# Reproduit la topologie locale doc-archiver dans un environnement jetable (CI ou local),
# pour que l'agent teste EXACTEMENT comme s'il etait devant l'instance locale.
#
# Villes montees : casa (CLUSTER) + rabat (SINGLE_SERVER, backup_of=fes).
# NB : la replication inter-sites reelle n'est PAS testee ici (hors scope, deja validee).
#      rabat est monte pour que la topologie ressemble au local, mais aucun VPN/fes n'est requis.
#
# L'API cree ses tables (init_all_db) et son bucket par defaut (ensure_all_buckets) toute seule
# au demarrage. Les BUCKETS PROJET (documents-projeta / -projetb) ne sont PAS crees par l'API :
# le service "minio-init" s'en charge avant que l'API demarre.
#
# Ce fichier attend d'etre lance depuis la RACINE du repo doc-archiver (le Dockerfile y est).

services:
  # ── PostgreSQL par ville ────────────────────────────────────────────────
  postgres-casa:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres-rabat:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ── MinIO par ville ─────────────────────────────────────────────────────
  # Le code attend un endpoint "minio-<ville>-1:9000" (cf. config.py _build_villes_config).
  minio-casa-1:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-rabat-1:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Init MinIO : cree les buckets PROJET (l'API ne cree que le bucket par defaut) ─
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio-casa-1:
        condition: service_healthy
      minio-rabat-1:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set casa http://minio-casa-1:9000 minioadmin minioadmin &&
      mc alias set rabat http://minio-rabat-1:9000 minioadmin minioadmin &&
      mc mb -p casa/documents casa/documents-projeta casa/documents-projetb &&
      mc mb -p rabat/documents &&
      echo 'Buckets projet crees (casa: documents, -projeta, -projetb ; rabat: documents)' &&
      exit 0
      "

  # ── API doc-archiver ────────────────────────────────────────────────────
  api:
    build:
      context: .              # racine du repo doc-archiver (contient le Dockerfile)
      dockerfile: Dockerfile
    depends_on:
      postgres-casa:
        condition: service_healthy
      postgres-rabat:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # ── Villes actives ──
      VILLES_ACTIVES: "casa,rabat"

      # ── Postgres (defaut global + par ville) ──
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: archive
      CASA_POSTGRES_HOST: postgres-casa
      RABAT_POSTGRES_HOST: postgres-rabat

      # ── MinIO (defaut global + endpoints par ville) ──
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: documents
      CASA_MINIO_ENDPOINT: "minio-casa-1:9000"
      RABAT_MINIO_ENDPOINT: "minio-rabat-1:9000"

      # ── Topologie de site (rabat = SINGLE_SERVER, backup vers fes en prod) ──
      CASA_SITE_TYPE: "CLUSTER"
      RABAT_SITE_TYPE: "SINGLE_SERVER"
      RABAT_BACKUP_OF: "fes"

      # ── TOKENS DE TEST (deterministes) ──
      # Legacy (API_TOKEN), Admin, Inter-sites, et les 2 projets via PROJECTS_JSON.
      API_TOKEN: "test-legacy-token"
      ADMIN_TOKEN: "test-admin-token"
      INTER_SITE_TOKEN: "test-intersite-token"
      PROJECTS_JSON: >-
        {
          "test-token-a": {"name": "ProjetA", "bucket": "documents-projeta", "access_key": "minioadmin", "secret_key": "minioadmin"},
          "test-token-b": {"name": "ProjetB", "bucket": "documents-projetb", "access_key": "minioadmin", "secret_key": "minioadmin"}
        }
    ports:
      - "30800:8000"          # expose comme en local (localhost:30800 -> API:8000)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 30
